name: Reporte validación de flota

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * 1-6"
      timezone: "America/Santiago"

    - cron: "0 15 * * 1-6"
      timezone: "America/Santiago"

permissions:
  contents: read

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest

    env:
      TZ: America/Santiago
      ENVIAR_CORREO: "true"

      DRIVIN_API_KEY: ${{ secrets.DRIVIN_API_KEY }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
      SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS }}

      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_CC: ${{ secrets.EMAIL_CC }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar reporte y enviar correo
        id: reporte
        run: python eventos_mal_clasificados_correo.py

      - name: Guardar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: validacion-estado-flota
          path: |
            validacion_estado_flota.xlsx
            reporte_validacion_flota.html
          retention-days: 15
