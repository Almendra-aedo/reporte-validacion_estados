name: Reporte validación flota

on:
  workflow_dispatch:

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl matplotlib

      - name: Generar reporte y enviar correo
        env:
          ENVIAR_CORREO: "true"
          DRIVIN_API_KEY: ${{ secrets.DRIVIN_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python eventos_mal_clasificados_correo.py

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-validacion-flota
          path: |
            validacion_estado_flota.xlsx
            kpi_validacion_flota.png
          if-no-files-found: ignore
